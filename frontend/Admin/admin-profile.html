<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Admin Profile | SU Transport</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link rel="icon" href="/image/logo.jpg" />
    <link rel="stylesheet" href="admin-profile.css" />

    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
    />
  </head>
  <body>
    <!-- ===== HEADER ===== -->
    <header class="brand-header">
      <img src="/image/logo.jpg" />
      <div class="brand-text">
        <h1>Southern University</h1>
        <p>Admin Profile</p>
      </div>
    </header>

    <div class="wrapper">
      <div class="card">
        <div class="profile-icon">
          <i class="fa-solid fa-user-shield"></i>
        </div>

        <!-- CHANGE THIS PART ONLY -->

        <h2>Admin Profile</h2>
        <span class="sub">System Administrator</span>

        <div class="info-grid">
          <div class="info-item">
            <input id="adminName" placeholder=" " required />
            <label>Name</label>
          </div>

          <div class="info-item">
            <input id="adminUsername" required />
            <label>Username</label>
          </div>

          <div class="info-item">
            <input id="adminMobile" required />
            <label>Mobile</label>
          </div>

          <div class="info-item">
            <input id="adminEmail" readonly />
            <label>Email</label>
          </div>

          <div class="info-item">
            <input id="adminRole" readonly required />
            <label>Role</label>
          </div>
        </div>

        <!-- ACTION BUTTONS -->

        <button class="save-btn" onclick="updateProfile()">
          <i class="fa-solid fa-floppy-disk"></i> Save Profile
        </button>

        <button class="reset-btn" onclick="openResetModal()">
          <i class="fa-solid fa-key"></i> Change Password
        </button>

        <button class="logout-btn" onclick="logoutAdmin()">
          <i class="fa-solid fa-right-from-bracket"></i> Logout
        </button>
      </div>
    </div>

    <!-- ===== RESET PASSWORD MODAL ===== -->
    <div class="modal" id="resetModal">
      <div class="modal-card">
        <h3>Reset Password</h3>

        <div class="info-item">
          <input type="password" id="oldPass" required />
          <label>Current Password</label>
        </div>

        <div class="info-item">
          <input type="password" id="newPass" required />
          <label>New Password</label>
        </div>

        <div class="info-item">
          <input type="password" id="confirmPass" required />
          <label>Confirm Password</label>
        </div>

        <button class="reset-btn" onclick="resetPassword()">
          <i class="fa-solid fa-check"></i> Reset
        </button>

        <button class="cancel-btn" onclick="closeResetModal()">Cancel</button>
      </div>
    </div>

    <!-- ===== BOTTOM NAV ===== -->
    <nav class="bottom-nav">
      <a href="/frontend/Admin/admin-dashboard.html" class="nav-item">
        <i class="fa-solid fa-chart-line"></i>
        <span>Dashboard</span>
      </a>

      <a href="/frontend/Admin/admin-driver-create.html" class="nav-item">
        <i class="fa-solid fa-user-plus"></i>
        <span>Create</span>
      </a>

      <a href="/frontend/Admin/admin-profile.html" class="nav-item active">
        <i class="fa-solid fa-user-shield"></i>
        <span>Profile</span>
      </a>
    </nav>

    <!-- ===== CUSTOM POPUP ===== -->
    <div id="popup" class="popup">
      <div class="popup-box">
        <p id="popupMsg"></p>
        <button onclick="closePopup()">OK</button>
      </div>
    </div>

    <script src="/frontend/Admin/admin-profile.js"></script>
  </body>
</html>
