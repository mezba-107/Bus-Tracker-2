<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Driver Login | SU Transport</title>

    <link rel="stylesheet" href="/frontend/driver-side/driver-login.css" />
    <link rel="icon" href="/image/logo.jpg" />

    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
    />
  </head>
  <body>
    <div class="bg"></div>

    <!-- ===== BRAND HEADER ===== -->
    <header class="brand-header">
      <img src="/image/logo.jpg" alt="SU Logo" />
      <div class="brand-text">
        <h1>Southern University</h1>
        <p>Smart Transport System</p>
      </div>
    </header>

    <div class="login-wrapper">
      <div class="login-card">
        <div class="icon-wrap">
          <i class="fa-solid fa-bus"></i>
        </div>

        <h2>Driver Login</h2>
        <p>Authorized Drivers Only</p>

        <div class="input-group">
          <i class="fa-solid fa-user"></i>
          <input type="text" id="username" placeholder=" " />
          <label>Driver ID</label>
        </div>

        <div class="input-group">
          <i class="fa-solid fa-lock"></i>
          <input type="password" id="password" placeholder=" " />
          <label>Password</label>
        </div>

        <button onclick="login()">
          <i class="fa-solid fa-arrow-right"></i>
          Login
        </button>

        <span class="note">Southern University Transport System</span>
      </div>
    </div>

    <script src="/frontend/driver-side/driver-login.js"></script>
  </body>
</html>
